{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="card" style="max-width:440px; margin:60px auto;">
    <h2>&#128221; Create Account</h2>
    <p class="subtitle">Register to start predicting news popularity.</p>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username"
                   placeholder="Choose a username" required autofocus>
        </div>
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>
        </div>
        <div class="form-group">
            <label for="password">Password <span class="small">(min 6 characters)</span></label>
            <input type="password" id="password" name="password"
                   placeholder="Create a password" required>
        </div>
        <button type="submit" class="btn" style="width:100%;">Create Account</button>
    </form>

    <p class="link-row text-center">
        Already have an account? <a href="{{ url_for('login') }}">Login here</a>
    </p>
</div>
{% endblock %}
